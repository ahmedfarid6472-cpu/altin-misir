backend:
  name: git-gateway
  branch: main # تأكد أن هذا هو اسم الفرع الأساسي عندك على GitHub

media_folder: "image" # الفولدر اللي فيه صورك الحالية
public_folder: "image"

collections:
  - name: "tours"
    label: "Tours"
    folder: "tours" # سيتم إنشاء فولدر جديد للرحلات تلقائياً
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tour Name", name: "title", widget: "string" }
      - { label: "Description", name: "body", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Price", name: "price", widget: "number" }
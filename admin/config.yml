backend:
  name: git-gateway
  branch: main

media_folder: "image"
public_folder: "image"

collections:
  # 1. قسم الرحلات (Tours)
  - name: "tours"
    label: "Tours (الرحلات)"
    folder: "tours"
    create: true
    slug: "{{slug}}"
    extension: "json" # مهم جداً عشان يحفظ الرحلة كملف JSON نقدر نقراه بسهولة
    format: "json"
    fields:
      - { label: "Tour Name (اسم الرحلة)", name: "title", widget: "string" }
      - { label: "Description (الوصف)", name: "body", widget: "text" }
      - { label: "Featured Image (صورة الرحلة)", name: "image", widget: "image" }
      - { label: "Price (السعر)", name: "price", widget: "number" }
      - { label: "Location (المكان - اختياري)", name: "location", widget: "string", required: false }

  # 2. قسم الجاليري وإعدادات الموقع (Gallery)
  - name: "settings"
    label: "Site Content (محتوى الموقع)"
    files:
      - label: "Gallery (معرض الصور)"
        name: "gallery"
        file: "data/gallery.json" # هيعمل ملف واحد يلم فيه كل صور الجاليري
        fields:
          - label: "Gallery Images (صور المعرض)"
            name: "gallery_items"
            widget: "list" # ده هيسمحلك تضيف صور كتير وترتبهم زي ما تحب
            fields:
              - { label: "Image (الصورة)", name: "image", widget: "image" }
              - { label: "Location Name (اسم المكان)", name: "location", widget: "string" }